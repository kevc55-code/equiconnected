<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page introuvable | EquiConnected</title>
  <link rel="icon" href="/icon.svg">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1B2620; background: #F4FBF7; }
    header { background: #1FA870; padding: 14px 16px; }
    header a { color: #fff; text-decoration: none; font-family: Georgia, serif; font-size: 20px; font-weight: 600; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 16px; text-align: center; }
    h1 { font-family: Georgia, serif; font-style: italic; font-weight: 600; font-size: 32px; color: #0A5C3B; margin: 16px 0 8px; }
    p { margin: 4px 0 24px; color: #1B2620b3; }
    .langs { display: grid; gap: 28px; margin-top: 40px; }
    .btn { display: inline-block; background: #1FA870; color: #fff; text-decoration: none; font-weight: 600; padding: 10px 20px; border-radius: 6px; }
    .btn:hover { background: #0E7A4F; }
    .muted { font-size: 14px; color: #1B262099; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header><a href="/fr/">EquiConnected</a></header>
  <main>
    <img src="/icon.svg" alt="" width="64" height="64">
    <h1>Page introuvable</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
    <a class="btn" href="/fr/">Retour à l'accueil</a>
    <div class="langs">
      <div lang="en">
        <p class="muted">This page could not be found.</p>
        <a href="/en/">Go to the English home page</a>
      </div>
      <div lang="de">
        <p class="muted">Diese Seite wurde nicht gefunden.</p>
        <a href="/de/">Zur deutschen Startseite</a>
      </div>
    </div>
  </main>
</body>
</html>
